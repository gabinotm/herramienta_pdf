<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Herramientas PDF gratuitas en español: unir, dividir, comprimir, convertir, firmar, proteger y más. Tus archivos se procesan en tu navegador y nunca se suben a un servidor.">
    <meta name="color-scheme" content="light dark">
    <title>PDF PRO — Herramientas PDF</title>
    <link rel="icon" type="image/png" href="img/logo.png">

    <!-- Tema: se aplica antes de pintar para evitar parpadeo -->
    <script>
        try {
            var t = localStorage.getItem('pdfpro-theme');
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { /* almacenamiento no disponible */ }
    </script>

    <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/regular.min.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Librerías base (versiones fijas, incluidas en /vendor) -->
    <script src="vendor/pdf-lib.min.js"></script>
    <script src="vendor/jszip.min.js"></script>
    <script src="vendor/Sortable.min.js"></script>
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <header class="site-header">
        <div class="container header-inner">
            <a href="#/" class="brand" aria-label="PDF PRO, ir al inicio">
                <img src="img/logo.png" alt="" class="brand-logo">
                <span class="brand-name">PDF <strong>PRO</strong></span>
            </a>
            <nav class="header-nav" aria-label="Principal">
                <a href="#/" class="header-link"><i class="fa-solid fa-grip" aria-hidden="true"></i> <span>Todas las herramientas</span></a>
                <button type="button" id="themeToggle" class="icon-btn" aria-label="Cambiar tema">
                    <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
                </button>
            </nav>
        </div>
    </header>

    <main id="main" tabindex="-1">
        <div id="app" class="container"></div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p><i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                Tus archivos se procesan <strong>en tu propio navegador</strong>: nunca se suben a ningún servidor ni se guardan.</p>
        </div>
    </footer>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <noscript>
        <p class="noscript">Esta aplicación necesita JavaScript activado.</p>
    </noscript>

    <script type="module" src="js/app.js"></script>
</body>

</html>
